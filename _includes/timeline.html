<style>
/* 时间轴容器：和 Academic Pages 正文完全一致 */
.timeline-wrapper {
  max-width: 720px;
  margin: 0 auto;
  padding-left: 0;

  /* ✅ PC / 平板：相对自适应左移 */
  transform: translateX(calc(-5% - 12px));
}

/* ✅ 手机端：取消左移，防止溢出 */
@media (max-width: 768px) {
  .timeline-wrapper {
    transform: none;
    padding-left: 12px;
  }
}

/* 时间轴本体 */
.timeline {
  position: relative;
  padding: 10px 0;
}

/* 中间竖线：从容器最左侧开始画 */
.timeline::before {
  content: "";
  position: absolute;
  left: 0;               /* ⭐ 关键：从容器最左开始 */
  top: 0;
  bottom: 0;
  width: 2px;
  background: #d0d7de;
}

/* 每一项 */
.timeline-item {
  position: relative;
  margin-bottom: 28px;
  padding-left: 32px;    /* ⭐ 关键：给圆点留空间，但不跳太远 */
}

/* 蓝色圆点：紧贴竖线右侧 */
.timeline-item::before {
  content: "";
  position: absolute;
  left: -6px;            /* ⭐ 关键：让圆点覆盖在竖线上 */
  top: 6px;
  width: 12px;
  height: 12px;
  background: #0056b3;
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #0056b3;
  z-index: 1;
}

/* 时间 */
.timeline-time {
  font-weight: 600;
  font-size: 15px;
  color: #0056b3;
  margin-bottom: 4px;
  font-family: "Times New Roman", serif;
}

/* 内容卡片 */
.timeline-content {
  background: #f6f8fa;
  padding: 12px 16px;
  border-radius: 6px;
  line-height: 1.7;
  color: #24292f;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.journal-list {
  margin-top: 8px;
  padding: 10px 12px;
  background-color: #f4f6f8;   /* 浅灰背景，无框线 */
  border-radius: 6px;
  line-height: 1.65;
  font-size: 18px;
  color: #444;
  word-break: break-word;      /* 自动换行 */
}

/* 让期刊名之间更舒服一点（可选） */
.journal-list {
  letter-spacing: 0.2px;
}
</style>

<div class="timeline-wrapper">
  <div class="timeline">
    {{ include.body }}
  </div>
</div>
