<style>
/* ===== 时间轴：和 Education 的 E 对齐 ===== */

/* 外层容器：和主题正文同宽、同缩进 */
.timeline-wrapper {
  max-width: 720px;      /* Academic Pages 正文常见宽度 */
  margin: 0 auto;        /* ✅ 关键：和 Education 居中对齐 */
  padding-left: 4px;       /* 不额外缩进 */
}

/* 时间轴本体 */
.timeline {
  position: relative;
  padding: 10px 0;
}

/* 中间竖线：相对容器居中，而不是 left:30px */
.timeline::before {
  content: "";
  position: absolute;
  left: 24px;            /* ✅ 相对时间轴容器定位 */
  top: 0;
  bottom: 0;
  width: 2px;
  background: #d0d7de;
}

/* 每一项 */
.timeline-item {
  position: relative;
  margin-bottom: 28px;
  padding-left: 56px;    /* 24px(线) + 12px(圆点半径) + 20px(间距) */
}

/* 蓝色圆点 */
.timeline-item::before {
  content: "";
  position: absolute;
  left: 18px;            /* 和竖线中心对齐 */
  top: 6px;
  width: 12px;
  height: 12px;
  background: #0056b3;
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #0056b3;
  z-index: 1;
}

/* 时间 */
.timeline-time {
  font-weight: 600;
  font-size: 15px;
  color: #0056b3;
  margin-bottom: 4px;
  font-family: "Times New Roman", serif;
}

/* 内容卡片 */
.timeline-content {
  background: #f6f8fa;
  padding: 12px 16px;
  border-radius: 6px;
  line-height: 1.7;
  color: #24292f;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
</style>

<div class="timeline-wrapper">
  <div class="timeline">
    {{ include.body }}
  </div>
</div>
